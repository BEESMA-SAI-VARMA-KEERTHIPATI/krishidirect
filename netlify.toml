[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL"
  VITE_API_URL = "https://krishidirect-s2s4.onrender.com"

# Reverse proxy for backend API calls if relative
[[redirects]]
  from = "/api/*"
  to = "https://krishidirect-s2s4.onrender.com/api/:splat"
  status = 200
  force = false

# SPA route fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
